# Terms that mark a recording whose .log says "replace me" (avior-go log_include).
# A copy whose .log contains any of these terms loses against one that does not
# when the `log_include` selection priority is active.
#
# Matching is a plain case-insensitive substring search on the .log content with
# the avior-go trailer removed (everything from "avior-go info" onwards), so a
# file never matches through its own past module output.
- "-tune hq"
- "-rc vbr_hq -qmin 16 -qmax 23"
- "-c:v av1_qsv -global_quality:v"
- "encoder x265"
- "Lost Data:"
